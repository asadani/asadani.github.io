// ═══════════════════════════════════════════════════════════════════
//  LAYOUT
// ═══════════════════════════════════════════════════════════════════

const W = 1200, H = 1150;
const CX = W / 2, CY = H / 2 + 20;
const R_CLUSTER = 200;
const R_TOOL    = 510;

// Flatten all tools in cluster order, assign global angular positions
const allTools = [];
CLUSTERS.forEach(c => c.tools.forEach(t => allTools.push({ t, c })));
const N = allTools.length; // 37 tools

allTools.forEach(({ t, c }, i) => {
  t.angle = (i / N) * 2 * Math.PI - Math.PI / 2; // start from top
  t.x = CX + R_TOOL    * Math.cos(t.angle);
  t.y = CY + R_TOOL    * Math.sin(t.angle);
  t.cluster = c;
});

// Cluster position = mean angle of its tools
CLUSTERS.forEach(c => {
  const myAngles = c.tools.map(t => t.angle);
  // Handle angle wrap-around at -PI/2 boundary
  let mean = myAngles.reduce((s, a) => s + a, 0) / myAngles.length;
  c.angle = mean;
  c.x = CX + R_CLUSTER * Math.cos(mean);
  c.y = CY + R_CLUSTER * Math.sin(mean);
});

// ═══════════════════════════════════════════════════════════════════
//  NODE SIZING
// ═══════════════════════════════════════════════════════════════════

const MONO_W = 5.55; // JetBrains Mono 9px — px per char
const MONO_PAD = 14;

function nodeW(lines) {
  const maxLen = Math.max(...lines.map(l => l.length));
  return Math.max(62, maxLen * MONO_W + MONO_PAD);
}
function nodeH(lines) { return lines.length === 1 ? 26 : 36; }

function clusterW(label) { return Math.max(120, label.length * 6.8 + 36); }

// ═══════════════════════════════════════════════════════════════════
//  BUILD SVG
// ═══════════════════════════════════════════════════════════════════

const svg  = document.getElementById('mindmap');
const NS   = 'http://www.w3.org/2000/svg';
const mainG = el('g', { id: 'g' }, svg);

function el(tag, attrs = {}, parent = null) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function tx(text, x, y, attrs = {}, parent) {
  const e = el('text', { x, y, ...attrs }, parent);
  e.textContent = text;
  return e;
}

// ── 1. Root → cluster links ──────────────────────────────────────
CLUSTERS.forEach(c => {
  el('path', {
    d: bezier(CX, CY, c.x, c.y),
    stroke: c.color, 'stroke-width': '2.6', fill: 'none', 'stroke-opacity': '0.35'
  }, mainG);
});

// ── 2. Cluster → tool links ──────────────────────────────────────
CLUSTERS.forEach(c => {
  c.tools.forEach(t => {
    el('path', {
      d: bezier(c.x, c.y, t.x, t.y),
      stroke: c.color, 'stroke-width': '1.4', fill: 'none', 'stroke-opacity': '0.28'
    }, mainG);
  });
});

// ── 3. Tool nodes ────────────────────────────────────────────────
CLUSTERS.forEach(c => {
  c.tools.forEach(t => {
    const w = nodeW(t.lines), h = nodeH(t.lines);
    const grp = el('g', { class: 'tool-node', 'data-cid': c.id }, mainG);
    grp.style.cursor = 'pointer';

    el('rect', {
      x: t.x - w/2, y: t.y - h/2, width: w, height: h, rx: 13,
      fill: c.bg, stroke: c.border, 'stroke-width': '1.5'
    }, grp);

    if (t.lines.length === 1) {
      tx(t.lines[0], t.x, t.y + 3.5, {
        'text-anchor': 'middle', fill: c.color,
        'font-family': "'JetBrains Mono',monospace", 'font-size': '9', 'font-weight': '500'
      }, grp);
    } else {
      tx(t.lines[0], t.x, t.y - 4, {
        'text-anchor': 'middle', fill: c.color,
        'font-family': "'JetBrains Mono',monospace", 'font-size': '9', 'font-weight': '500'
      }, grp);
      tx(t.lines[1], t.x, t.y + 7, {
        'text-anchor': 'middle', fill: c.color,
        'font-family': "'JetBrains Mono',monospace", 'font-size': '9', 'font-weight': '500'
      }, grp);
    }

    grp.addEventListener('mouseenter', e => showTip(e, t, c));
    grp.addEventListener('mousemove',  e => posTip(e));
    grp.addEventListener('mouseleave', () => scheduleTipHide());
  });
});

// ── 4. Cluster nodes ─────────────────────────────────────────────
CLUSTERS.forEach(c => {
  const cw = clusterW(c.label);
  const ch = 44;
  const grp = el('g', { class: 'cluster-node', 'data-cid': c.id }, mainG);
  grp.style.cursor = 'pointer';

  el('rect', {
    x: c.x - cw/2, y: c.y - ch/2, width: cw, height: ch, rx: 22,
    fill: c.bg, stroke: c.color, 'stroke-width': '2.2'
  }, grp);

  tx(c.label, c.x, c.y - 4, {
    'text-anchor': 'middle', fill: c.color,
    'font-family': "'Inter',sans-serif", 'font-size': '12', 'font-weight': '700'
  }, grp);

  // Multi-line question (split on \n)
  const qlines = c.question.split('\n');
  tx(qlines[0], c.x, c.y + 9, {
    'text-anchor': 'middle', fill: c.color, opacity: '0.65',
    'font-family': "'Inter',sans-serif", 'font-size': '9', 'font-weight': '400'
  }, grp);

  grp.addEventListener('click', () => filterByCluster(c.id));
});

// ── 5. Root node ─────────────────────────────────────────────────
{
  const rw = 152, rh = 52;
  const grp = el('g', {}, mainG);

  el('rect', {
    x: CX - rw/2, y: CY - rh/2, width: rw, height: rh, rx: 14,
    fill: '#1A1714'
  }, grp);

  tx('AI Coding', CX, CY - 7, {
    'text-anchor': 'middle', fill: '#fff',
    'font-family': "'Inter',sans-serif", 'font-size': '14', 'font-weight': '700'
  }, grp);
  tx('Agent Stack', CX, CY + 11, {
    'text-anchor': 'middle', fill: '#fff',
    'font-family': "'Inter',sans-serif", 'font-size': '14', 'font-weight': '700'
  }, grp);
  tx('2026 · 6 clusters · 37 tools', CX, CY + 28, {
    'text-anchor': 'middle', fill: 'rgba(255,255,255,0.38)',
    'font-family': "'JetBrains Mono',monospace", 'font-size': '8.5'
  }, grp);

  grp.style.cursor = 'pointer';
  grp.addEventListener('click', () => filterByCluster(null));
}

// ═══════════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════════

function bezier(x1, y1, x2, y2) {
  // Cubic bezier — control points midway and slightly pulled toward center for organic feel
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  // Vector from center to midpoint
  const dx = mx - CX, dy = my - CY;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const pull = 0.08; // pull toward center
  const cpx = mx - dx * pull, cpy = my - dy * pull;
  return `M ${x1} ${y1} Q ${cpx} ${cpy} ${x2} ${y2}`;
}

// ═══════════════════════════════════════════════════════════════════
//  TOOLTIP
// ═══════════════════════════════════════════════════════════════════

const tip = document.getElementById('tip');
let tipHideTimer = null;
let tipVisible = false;

function showTip(e, t, c) {
  clearTimeout(tipHideTimer);
  tipVisible = true;

  const linkUrl = t.link;
  const officialUrl = t.official || null;
  const isGitHub = linkUrl && linkUrl.includes('github.com');
  const linkLabel = isGitHub ? 'GitHub →' : 'Official site →';

  let linksHtml = '';
  if (linkUrl) {
    linksHtml += `<a class="tip-link" href="${linkUrl}" target="_blank" rel="noopener"
      style="background:${c.bg};color:${c.color};border-color:${c.border}">${linkLabel}</a> `;
  }
  if (officialUrl) {
    linksHtml += `<a class="tip-link" href="${officialUrl}" target="_blank" rel="noopener"
      style="background:${c.bg};color:${c.color};border-color:${c.border};margin-left:6px">Docs →</a>`;
  }

  tip.innerHTML = `
    <div class="tip-name">${t.name}</div>
    <div class="tip-cluster" style="color:${c.color}">${c.label}</div>
    <div class="tip-desc">${t.desc}</div>
    ${linksHtml}
  `;
  tip.style.display = 'block';
  posTip(e);
}

function posTip(e) {
  const tw = tip.offsetWidth + 6, th = tip.offsetHeight + 6;
  let lx = e.clientX + 18, ly = e.clientY - 14;
  if (lx + tw > window.innerWidth)  lx = e.clientX - tw + 6;
  if (ly + th > window.innerHeight) ly = e.clientY - th + 4;
  if (ly < 52) ly = 52;
  tip.style.left = lx + 'px';
  tip.style.top  = ly + 'px';
}

function scheduleTipHide() {
  tipHideTimer = setTimeout(() => { if (!tipVisible) tip.style.display = 'none'; }, 160);
  tipVisible = false;
}

tip.addEventListener('mouseenter', () => { clearTimeout(tipHideTimer); tipVisible = true; });
tip.addEventListener('mouseleave', () => { tipVisible = false; tip.style.display = 'none'; });

// ═══════════════════════════════════════════════════════════════════
//  CLUSTER FILTER
// ═══════════════════════════════════════════════════════════════════

let activeCluster = null;

function filterByCluster(cid) {
  activeCluster = cid === activeCluster ? null : cid;
  const toolNodes    = document.querySelectorAll('.tool-node');
  const clusterNodes = document.querySelectorAll('.cluster-node');
  const links        = mainG.querySelectorAll('path');

  if (!activeCluster) {
    [...toolNodes, ...clusterNodes, ...links].forEach(n => n.classList.remove('dimmed'));
    return;
  }

  toolNodes.forEach(n => {
    n.classList.toggle('dimmed', n.dataset.cid !== activeCluster);
  });
  clusterNodes.forEach(n => {
    n.classList.toggle('dimmed', n.dataset.cid !== activeCluster);
  });
  // dim all links (keep it simple — cluster isolation is enough)
  links.forEach(n => n.classList.add('dimmed'));
}

// ═══════════════════════════════════════════════════════════════════
//  PAN / ZOOM
// ═══════════════════════════════════════════════════════════════════

let pX = 0, pY = 0, sc = 1;
let drag = false, dX0 = 0, dY0 = 0, pX0 = 0, pY0 = 0;
let pinch = false, lastD = 0;

function applyT() {
  mainG.setAttribute('transform', `translate(${pX},${pY}) scale(${sc})`);
}

function fitView() {
  const r = svg.getBoundingClientRect();
  const s = Math.min(r.width / W, r.height / H) * 0.92;
  sc = s;
  pX = (r.width  - W * s) / 2;
  pY = (r.height - H * s) / 2;
  applyT();
}

window.addEventListener('resize', fitView);

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r  = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const f  = e.deltaY < 0 ? 1.12 : 0.89;
  const ns = Math.max(0.22, Math.min(4.5, sc * f));
  pX = mx - (mx - pX) * (ns / sc);
  pY = my - (my - pY) * (ns / sc);
  sc = ns;
  applyT();
}, { passive: false });

svg.addEventListener('mousedown', e => {
  if (e.target.closest('.tool-node, .cluster-node')) return;
  drag = true; dX0 = e.clientX; dY0 = e.clientY; pX0 = pX; pY0 = pY;
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  pX = pX0 + (e.clientX - dX0);
  pY = pY0 + (e.clientY - dY0);
  applyT();
});
window.addEventListener('mouseup', () => { drag = false; });

svg.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    pinch = true;
    lastD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
  } else if (e.touches.length === 1) {
    drag = true; dX0 = e.touches[0].clientX; dY0 = e.touches[0].clientY; pX0 = pX; pY0 = pY;
  }
}, { passive: true });

svg.addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinch && e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    sc = Math.max(0.22, Math.min(4.5, sc * d / lastD));
    lastD = d;
    applyT();
  } else if (drag && e.touches.length === 1) {
    pX = pX0 + (e.touches[0].clientX - dX0);
    pY = pY0 + (e.touches[0].clientY - dY0);
    applyT();
  }
}, { passive: false });

svg.addEventListener('touchend', () => { drag = false; pinch = false; });

function resetView() { fitView(); }

requestAnimationFrame(fitView);
</script>
